name: Security and regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets with redacted output
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.0 git --redact --no-banner

  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore pinned dependencies and verified tools
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Python regression suite
        shell: pwsh
        run: |
          $env:TEMP = Join-Path $pwd '.tmp'
          $env:TMP = $env:TEMP
          ./.venv/Scripts/python.exe -m pytest -q --basetemp .tmp/pytest-ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip check
      - name: Android build, receiver tests and resolved dependency inventory
        shell: pwsh
        run: |
          ./scripts/build-android.ps1
          ./.tools/gradle-8.10.2/bin/gradle.bat -p android --no-daemon assembleDebugAndroidTest securityDependencyInventory
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Audit exact Python and Maven packages
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/audit_dependencies.py --maven .tmp/android-dependencies.json
